name: CI

# Pull-request / push gate for the site. Cloudflare Workers Builds is what
# actually deploys (`bun run build` on every push to `main`), but until this
# workflow existed nothing checked a PR *before* it reached `main` — a broken
# build only surfaced as a failed deploy. This job runs the same install and
# build as the deploy, plus `astro check` (types + content schema) and the
# data-layer tests, so a required status check named `build` can gate `main`.
#
# It is deliberately read-only: no deploy, no token use, no writes.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes or calls the API; do not leave the
          # GITHUB_TOKEN in .git/config for later steps to pick up.
          persist-credentials: false

      # The site is a Bun project (bun.lock, engines.bun >= 1.3, scripts invoke
      # `bun scripts/*.ts` directly) — there is no package-lock.json, so
      # setup-node + `npm ci` would not work here. `latest` mirrors what
      # Cloudflare Workers Builds installs; package.json only sets a floor.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # `build` = build:data -> astro build -> pagefind. It must run before
      # `check` because `astro check` type-checks imports of the gitignored
      # src/data/generated/*.json that build:data emits.
      - name: Build
        run: bun run build

      - name: Check (astro check)
        run: bun run check

      - name: Test (data layer)
        run: bun test
